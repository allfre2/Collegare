services:
  collegare-db:
    image: mysql:8.4.4
    volumes:
      - collegare-db:/var/lib/mysql
    ports:
      - '33013:3306'
    environment:
      MYSQL_DATABASE: collegare
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uadmin -ppassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-net
  collegare:
    volumes:
      - .:/app/
    env_file:
      - .env
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - '1234:80'
    networks:
      - dev-net
    entrypoint: sh -c 'goose -dir infrastructure/persistence/migrations mysql "admin:password@tcp(collegare-db:3306)/collegare?parseTime=true&multiStatements=true" up && watcher'

volumes:
  collegare-db:

networks:
  dev-net:
    external: true
    name: dev-net